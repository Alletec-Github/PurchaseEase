name: Validate PurchaseEase
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: cp src/config/appConfig.example.ts src/config/appConfig.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --silent
      - run: npx expo install --check
      - run: npx expo export --platform ios --platform android
